<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b120d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قضية يلوستون">
<meta name="description" content="لعبة تحقيق بيئية للفرق: اختاروا عامل المكافحة الحيوية المناسب في يلوستون.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<title>قضية حديقة يلوستون الوطنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>

/* Layout: a field case file played as a game — one scene at a time, sticky HUD, evidence-tag cards, a searchable valley map */
:root{
  --paper:#f7f6f0; --card:#ece4d6; --card2:#e2ead6; --ink:#1f2a1a; --muted:#5d6656;
  --olive:#4f6b2e; --olive-ink:#ffffff; --tape:#e2b93b; --tape-ink:#2a2100;
  --good:#2f7a3d; --warn:#b07a12; --bad:#a63a2a; --line:#d5cfc2;
  --sky:#cfe0e3; --hill1:#8fa86a; --hill2:#6d8a4a; --hill3:#4f6b2e; --water:#5f97ad; --willow:#3f6a2a; --soil:#9c8460; --snow:#ffffff;
  --f-display:"Amiri","Noto Naskh Arabic","Times New Roman",serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13180f; --card:#232a1d; --card2:#1e2a1b; --ink:#e8eadf; --muted:#a7ae9c; --olive:#9dbb6a; --olive-ink:#13180f;
  --tape:#d9b03a; --tape-ink:#1b1500; --good:#6fc07e; --warn:#e0a83a; --bad:#e2786a; --line:#343d2c;
  --sky:#1d2b30; --hill1:#3b4d2c; --hill2:#2f4024; --hill3:#24331b; --water:#3f6f82; --willow:#5f8f43; --soil:#8a7352; --snow:#c9d3c4; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13180f; --card:#232a1d; --card2:#1e2a1b; --ink:#e8eadf; --muted:#a7ae9c; --olive:#9dbb6a; --olive-ink:#13180f;
  --tape:#d9b03a; --tape-ink:#1b1500; --good:#6fc07e; --warn:#e0a83a; --bad:#e2786a; --line:#343d2c;
  --sky:#1d2b30; --hill1:#3b4d2c; --hill2:#2f4024; --hill3:#24331b; --water:#3f6f82; --willow:#5f8f43; --soil:#8a7352; --snow:#c9d3c4; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:clamp(2rem,6vw,3rem);color:var(--olive)}
h2{font-size:clamp(1.6rem,4.5vw,2.1rem);color:var(--olive)}
h3{font-size:1.25rem}
p{margin:0}
a{color:var(--olive);font-weight:500}
.mono{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.06em}
.muted{color:var(--muted)}

/* HUD */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.team{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.score{background:var(--olive);color:var(--olive-ink);border-radius:999px;padding:2px 14px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;transition:transform .2s}
.score.pop{transform:scale(1.25)}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;background:var(--paper);color:var(--ink)}
.pill.streak{border-color:var(--tape);background:var(--tape);color:var(--tape-ink)}
button.pill{cursor:pointer;font-family:var(--f-body)}
.steps{display:flex;gap:5px;width:100%;overflow-x:auto}
.steps button{flex:1;min-width:58px;border:0;background:var(--card);color:var(--muted);font:500 .7rem var(--f-body);padding:6px 4px;border-radius:6px;cursor:pointer;white-space:nowrap}
.steps button.on{background:var(--olive);color:var(--olive-ink)}
.steps button.done{background:var(--card2);color:var(--ink)}
.steps button:disabled{opacity:.45;cursor:default}

section.scene{display:grid;gap:18px;padding-top:24px}
.tape{display:inline-block;background:var(--tape);color:var(--tape-ink);font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;padding:3px 12px;transform:rotate(-1.5deg);justify-self:start}
.card{background:var(--card);border-radius:14px;padding:18px}
.lead{font-size:1.06rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{appearance:none;border:0;background:var(--olive);color:var(--olive-ink);font:700 1rem var(--f-body);padding:12px 22px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--olive);border:1.5px solid var(--olive)}
.btn.big{font-size:1.15rem;padding:14px 30px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
input[type=text]{width:100%;font:500 1.05rem var(--f-body);padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}

.hero svg{width:100%;height:auto;display:block;border-radius:16px}
.hero .note{font-size:.85rem;color:var(--muted);margin-top:8px}
.rounds{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.rounds li{background:var(--card);border-radius:8px;padding:4px 12px;font-size:.88rem}
.rounds li b{font-family:var(--f-mono);color:var(--olive);margin-inline-end:6px}

details{background:var(--card);border-radius:12px;padding:12px 16px}
summary{cursor:pointer;font-weight:700}
details p{margin-top:8px}
.criteria{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:0;margin:0;list-style:none}
.criteria li{background:var(--card);border-radius:10px;padding:10px 12px;font-size:.92rem}
.criteria b{display:block;color:var(--olive)}

.profile{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}
.profile dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.93rem}
.profile dt{color:var(--muted)} .profile dd{margin:0;min-width:0}
@media (max-width:520px){.profile{grid-template-columns:1fr}.profile .trackbox{width:90px}}
.trackbox{background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:8px;text-align:center}
.trackbox svg{width:100%;height:auto;color:var(--ink)}
.trackbox small{display:block;font-size:.7rem;color:var(--muted)}

/* true/false */
.tf{display:grid;gap:10px}
.tfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.tfrow p{min-width:0}
.tfbtns{display:flex;gap:6px}
.tfbtns button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 .9rem var(--f-body);padding:6px 14px;border-radius:8px;cursor:pointer}
.tfrow.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--paper))}
.tfrow.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.tfrow .why{grid-column:1/-1;font-size:.88rem;color:var(--muted)}

/* quiz */
.q{display:grid;gap:10px}
.opts{display:grid;gap:8px}
.opt{text-align:right;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:500 .97rem var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--olive)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--paper))}
.opt.struck{text-decoration:line-through;opacity:.45}
.opt:disabled{cursor:default}
.fb{border-inline-start:4px solid var(--olive);padding:6px 12px;font-size:.95rem;background:var(--paper);border-radius:6px}
.lifeline{justify-self:start;border:1.5px dashed var(--olive);background:transparent;color:var(--olive);font:700 .85rem var(--f-body);padding:5px 12px;border-radius:999px;cursor:pointer}
.lifeline:disabled{opacity:.4;cursor:default}
.ev-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ev-num{font-family:var(--f-mono);background:var(--ink);color:var(--paper);padding:1px 8px;border-radius:4px;font-size:.75rem}
.obs{display:grid;gap:6px;font-size:.95rem}
.obs b{color:var(--olive)}

/* clue hunt */
.hunt{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--ink);max-width:100%}
.hunt svg{display:block;width:100%;height:auto;cursor:zoom-in;touch-action:manipulation}
.hunt .spot circle.hit{fill:transparent}
.hunt .spot .ring{fill:none;stroke:var(--tape);stroke-width:5;opacity:0}
.hunt .spot.found .ring{opacity:1}
.hunt .spot.hinted .ring{opacity:1;stroke-dasharray:10 8}
@media (prefers-reduced-motion:no-preference){.hunt .spot.hinted .ring{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}}
.hunt .pin{display:none}
.hunt .spot.found .pin{display:inline}
.huntbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.huntbar .found{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.1rem}
.toast{min-height:1.75em;font-weight:500}

/* tracks */
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.trk{background:var(--card);border-radius:14px;padding:12px;display:grid;gap:8px;justify-items:center;text-align:center}
.trk .snowbox{background:var(--snow);border-radius:10px;width:100%;display:grid;place-items:center;padding:8px}
.trk .snowbox svg{width:76px;height:76px;color:#3a3a3a}
.trk .names{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.trk .names button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:500 .82rem var(--f-body);padding:5px 4px;border-radius:8px;cursor:pointer}
.trk .names button.right{border-color:var(--good);background:var(--good);color:var(--paper)}
.trk .names button.wrong{border-color:var(--bad);background:var(--bad);color:var(--paper)}
.trk .names button:disabled{cursor:default}
.trk p{font-size:.82rem;text-align:right}

/* suspects */
.suspects{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sus{position:relative;background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px 12px 12px;cursor:pointer;text-align:center;color:var(--ink);font:inherit;display:grid;gap:6px;justify-items:center}
.sus:hover{border-color:var(--olive)}
.sus svg{width:64px;height:64px;color:var(--ink)}
.sus .nm{font-family:var(--f-display);font-size:1.15rem;font-weight:700;line-height:1.2}
.sus .tag{font-size:.72rem;color:var(--muted)}
.sus .num{position:absolute;top:8px;inset-inline-start:10px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.chip{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 10px;border:1.5px solid currentColor}
.chip.fit{color:var(--good)} .chip.maybe{color:var(--warn)} .chip.out{color:var(--bad)} .chip.none{color:var(--muted);border-style:dashed}

dialog{border:0;border-radius:16px;padding:0;max-width:min(640px,calc(100vw - 24px));width:100%;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,8,.6)}
.dlg{padding:20px;display:grid;gap:14px;max-height:85vh;overflow:auto}
.dlg-head{display:flex;gap:14px;align-items:center}
.dlg-head svg{width:56px;height:56px;flex:none;color:var(--ink)}
.dlg-head .sci{font-style:italic;font-size:.85rem;color:var(--muted);direction:ltr;text-align:right}
.quote{font-family:var(--f-display);font-size:1.25rem;line-height:1.6;background:var(--card2);border-radius:12px;padding:12px 16px;position:relative}
.quote small{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--muted)}
.facts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.facts li{background:var(--card);border-radius:10px;padding:8px 12px;font-size:.93rem}
.facts li b{color:var(--olive)}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.verdict button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:700 .95rem var(--f-body);padding:10px 6px;border-radius:10px;cursor:pointer}
.verdict button[aria-pressed=true].fit{background:var(--good);border-color:var(--good);color:var(--paper)}
.verdict button[aria-pressed=true].maybe{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.verdict button[aria-pressed=true].out{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.x{margin-inline-start:auto;border:0;background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex:none}

.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font:700 1rem var(--f-display);cursor:pointer;display:grid;justify-items:center;gap:4px}
.pick button svg{width:44px;height:44px;color:var(--ink)}
.pick button[aria-pressed=true]{border-color:var(--olive);background:var(--card2);box-shadow:0 0 0 3px color-mix(in srgb,var(--olive) 35%,transparent)}

/* reveal */
.stamp{justify-self:center;font-family:var(--f-display);font-size:1.7rem;font-weight:700;color:var(--bad);border:3px solid var(--bad);padding:4px 22px;border-radius:8px;transform:rotate(-4deg)}
.stamp.win{color:var(--good);border-color:var(--good)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}@keyframes slam{from{transform:rotate(-4deg) scale(3);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}}
.rank{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.rank svg{width:72px;height:72px;flex:none}
.rank .t{font-family:var(--f-display);font-size:1.5rem;font-weight:700;color:var(--olive)}
.timeline{list-style:none;margin:0;padding:0;display:grid;border-inline-start:3px solid var(--olive);margin-inline-start:8px}
.timeline li{position:relative;padding-block:4px 14px;padding-inline-start:18px}
.timeline li::before{content:"";position:absolute;inset-inline-start:-9px;top:10px;width:15px;height:15px;border-radius:50%;background:var(--paper);border:3px solid var(--olive)}
.timeline .yr{font-family:var(--f-mono);font-weight:500;color:var(--olive);font-variant-numeric:tabular-nums}
.ba{position:relative;border-radius:14px;overflow:hidden;max-width:100%}
.ba svg{display:block;width:100%;height:auto}
.ba .after{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--pos,50%)) 0 0)}
.ba .divider{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.5)}
.ba .lbl{position:absolute;top:8px;background:var(--ink);color:var(--paper);font-size:.75rem;padding:1px 10px;border-radius:4px}
.ba .lbl.l{left:8px} .ba .lbl.r{right:8px}
input[type=range]{width:100%;accent-color:var(--olive)}
.scorebig{font-family:var(--f-mono);font-size:3.2rem;color:var(--olive);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.95rem}
.breakdown span:nth-child(even){font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sources{display:grid;gap:6px;padding:0;margin:0;list-style:none;font-size:.92rem}
.guide ol{margin:6px 0 0;padding-inline-start:20px}

/* effects */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#count{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 88%,transparent);color:var(--paper);text-align:center}
#count .n{font-family:var(--f-mono);font-size:clamp(6rem,30vw,12rem);line-height:1}
#count .l{font-family:var(--f-display);font-size:1.5rem}
@media (prefers-reduced-motion:no-preference){
 section.scene{animation:in .35s ease}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
 .shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
 #count .n{animation:beat .7s ease}@keyframes beat{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
}

/* v3 additions: real photos and video */
.photo{position:relative;border-radius:16px;overflow:hidden;margin:0;max-width:100%}
.photo img{display:block;width:100%;height:auto;aspect-ratio:848/416;object-fit:cover}
.photo figcaption,.media figcaption{font-size:.8rem;color:var(--muted);padding-top:6px}
.hero-photo{position:relative;border-radius:18px;overflow:hidden}
.hero-photo img{display:block;width:100%;height:auto;aspect-ratio:16/8;object-fit:cover}
.hero-photo .ov{position:absolute;inset:auto 0 0 0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(12,16,9,.85));color:#fff}
.hero-photo .ov h1{color:#fff}
.hero-photo .ov p{color:#e8eadf;font-size:.85rem}
.media{margin:0;max-width:100%}
.media video{display:block;width:100%;height:auto;border-radius:14px;background:var(--ink)}
.tagline{display:inline-block;font-size:.72rem;font-weight:700;background:var(--ink);color:var(--paper);border-radius:4px;padding:0 8px;margin-inline-end:6px}
.chapter{display:grid;gap:12px}
.chapter .num{font-family:var(--f-mono);color:var(--olive);font-size:.8rem;letter-spacing:.1em}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.split>*{min-width:0}
.facttable{width:100%;border-collapse:collapse;font-size:.93rem}
.facttable th,.facttable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.facttable th{color:var(--olive);font-weight:700;width:34%;white-space:nowrap}
.tablewrap{overflow-x:auto;background:var(--card);border-radius:14px;padding:6px 8px}
.list{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.sw h4{margin:0 0 6px;font-family:var(--f-display);font-size:1.15rem}
.sw.plus h4{color:var(--good)} .sw.minus h4{color:var(--bad)}
.ptype{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;background:var(--card);border-radius:12px;padding:12px}
.ptype svg{width:64px;height:64px;color:var(--olive)}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.mrow svg{width:44px;height:44px;color:var(--ink)}
.mrow .mopts{display:flex;flex-wrap:wrap;gap:6px}
.mrow .mopts button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 .85rem var(--f-body);padding:5px 10px;border-radius:8px;cursor:pointer}
.mrow.right{border-color:var(--good)} .mrow.wrong{border-color:var(--bad)}
.mrow .mopts button.right{background:var(--good);border-color:var(--good);color:var(--paper)}
.mrow .mopts button.wrong{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.mrow .mopts button:disabled{cursor:default}
.note{background:var(--card2);border-radius:12px;padding:12px 16px;font-size:.92rem}
.paths{display:grid;gap:10px}
.paths details summary{display:flex;gap:10px;align-items:center}
.paths details summary svg{width:36px;height:36px;color:var(--ink);flex:none}
.paths h4{margin:10px 0 2px;color:var(--olive);font-size:.95rem}
.paths .real{color:var(--good);font-size:.75rem;border:1.5px solid currentColor;border-radius:999px;padding:0 8px;margin-inline-start:auto;font-weight:700}
.paths .what{color:var(--muted);font-size:.75rem;border:1.5px dashed currentColor;border-radius:999px;padding:0 8px;margin-inline-start:auto;font-weight:700}
.takeaway{counter-reset:k;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.takeaway li{counter-increment:k;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:var(--card);border-radius:10px;padding:10px 12px}
.takeaway li::before{content:counter(k);font-family:var(--f-mono);background:var(--olive);color:var(--olive-ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:.85rem}
.ext{font-size:.85rem}
.closing{background:var(--ink);color:var(--paper);border-radius:18px;padding:20px;display:grid;gap:14px}
.closing h3{color:var(--tape)}
.closing p{font-family:var(--f-display);font-size:1.3rem;line-height:1.7}
.closing .media figcaption{color:var(--paper);opacity:.75}
.board{display:grid;gap:12px}
.board form{display:grid;grid-template-columns:1fr 110px auto;gap:8px}
.board input[type=number]::placeholder{font-family:var(--f-body);letter-spacing:0}
.board input[type=number]{width:100%;font:500 1.05rem var(--f-mono);padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
@media (max-width:480px){.board form{grid-template-columns:1fr 90px}.board form .btn{grid-column:1/-1}}
.brow{display:grid;grid-template-columns:36px 1fr auto 32px;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:8px 12px}
.brow .rk{font-family:var(--f-mono);font-weight:500;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper)}
.brow.top1 .rk{background:var(--tape);color:var(--tape-ink)}
.brow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bar{grid-column:2/4;height:8px;border-radius:4px;background:var(--paper);overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--olive)}
.brow .sc{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.1rem}
.brow .del{border:0;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;grid-row:1/3;grid-column:4}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.gal figure{margin:0;min-width:0}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--card2)}
.gal figcaption{font-size:.75rem;color:var(--muted);padding-top:3px}
.sus .sphoto{width:100%;aspect-ratio:1;object-fit:cover;object-position:center 30%;border-radius:10px;display:block}
.sus .num{z-index:1;background:var(--paper);border-radius:4px;padding:0 6px;top:20px;inset-inline-start:20px;color:var(--ink);font-weight:700}
.dlg-head img{width:64px;height:64px;object-fit:cover;border-radius:12px;flex:none}
.pick button img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.vwrap{position:relative}
.playbtn{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;border:0;background:rgba(15,20,12,.72);color:#fff;font-size:1.8rem;cursor:pointer;display:grid;place-items:center;padding-inline-start:6px}
.portrait{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:14px;align-items:start}
.portrait img{width:100%;border-radius:14px;display:block}
@media (max-width:560px){.portrait{grid-template-columns:1fr}}
.ba img{display:block;width:100%;aspect-ratio:315/205;object-fit:cover}
.ba .after img{height:100%;object-fit:cover}
.dlg .gal img{aspect-ratio:auto;max-height:340px;object-fit:contain;background:var(--card)}
.ptype img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.mrow img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.arena h2{color:var(--ink)}
.arena{
  --night:#0b120d; --pitch:#121c15; --panel:#18241b; --line:#2a3a2d;
  --ink:#eef2e6; --muted:#9aa892; --lime:#a9cc6e; --lime-ink:#0b120d;
  --gold:#f2c14e; --silver:#cfd6dd; --bronze:#d08a4a; --bad:#e57a6a;
  --f-display:"Lalezar","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  
color-scheme:dark;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100vh;background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(169,204,110,.16),transparent 70%)}

/* Layout: a night-stadium scoreboard — one committed dark look. Top: session bar. Body: edit list or reveal stage with podium. */




.arena .arena-in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:20px}
.arena h1,.arena h2{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
.arena h1{font-size:clamp(2rem,6vw,3.2rem);color:var(--gold);letter-spacing:.01em}
.arena h2{font-size:clamp(1.4rem,4vw,1.9rem)}
.arena p{margin:0}
.arena .muted{color:var(--muted)}
.arena button,.arena input,.arena select{font:inherit}
.arena .btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--lime);color:var(--lime-ink)}
.arena .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.arena .btn.gold{background:var(--gold);color:#241a00}
.arena .btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.arena .btn:disabled{opacity:.4;cursor:default}
.arena .btn:focus-visible,.arena button:focus-visible,.arena input:focus-visible,.arena select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.arena input[type=text],.arena input[type=number],.arena select{background:var(--pitch);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;min-width:0}
.arena input[type=number]{font-family:var(--f-mono);text-align:center}
.arena input::placeholder{font-family:var(--f-body);letter-spacing:0;color:var(--muted)}

.arena .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.arena .head .sub{font-size:.9rem;color:var(--muted)}
.arena .status{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.arena .bar{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--pitch);border:1px solid var(--line);border-radius:16px;padding:12px}
@media (max-width:560px){.arena .bar{grid-template-columns:1fr 1fr}.arena .bar select{grid-column:1/-1}}
.arena .newform{display:grid;grid-template-columns:1fr auto auto;gap:8px}
@media (max-width:560px){.arena .newform{grid-template-columns:1fr}}
.arena .tabs{display:flex;gap:6px;background:var(--pitch);border:1px solid var(--line);border-radius:14px;padding:5px;justify-self:start}
.arena .tabs button{border:0;background:transparent;color:var(--muted);padding:8px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.arena .tabs button[aria-pressed=true]{background:var(--lime);color:var(--lime-ink)}

/* edit */
.arena .panel{background:var(--pitch);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.arena .addrow{display:grid;grid-template-columns:1fr 110px auto;gap:8px}
@media (max-width:480px){.arena .addrow{grid-template-columns:1fr 90px}.arena .addrow .btn{grid-column:1/-1}}
.arena .teams{display:grid;gap:8px}
.arena .trow{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;align-items:center;background:var(--panel);border-radius:12px;padding:8px}
.arena .trow input[type=text]{background:transparent;border-color:transparent;font-weight:700}
.arena .trow input[type=text]:focus{border-color:var(--line)}
.arena .trow .x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;border-radius:8px;height:40px}
.arena .trow .x:hover{color:var(--bad)}
.arena .empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px 16px;text-align:center;display:grid;gap:6px;color:var(--muted)}
.arena .empty b{color:var(--ink);font-size:1.05rem}
.arena .confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(229,122,106,.1);border:1px solid var(--bad);border-radius:12px;padding:10px 12px}

/* stage */
.arena .stage{position:relative;background:linear-gradient(180deg,var(--pitch),var(--night));border:1px solid var(--line);border-radius:22px;padding:22px 16px;display:grid;gap:20px;overflow:hidden}
.arena .stage .title{text-align:center;display:grid;gap:4px}
.arena .stage .title h2{color:var(--gold);font-size:clamp(1.8rem,5vw,2.8rem)}
.arena .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.arena .podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;max-width:640px;margin:0 auto;width:100%}
.arena .pod{display:grid;gap:6px;justify-items:center;text-align:center;opacity:.18;transition:opacity .4s,transform .5s cubic-bezier(.2,1.4,.4,1);transform:translateY(16px)}
.arena .pod.on{opacity:1;transform:none}
.arena .pod .nm{font-family:var(--f-display);font-size:clamp(1rem,3.4vw,1.6rem);line-height:1.15;word-break:break-word}
.arena .pod .sc{font-family:var(--f-mono);font-size:clamp(1.3rem,4.5vw,2.2rem);font-variant-numeric:tabular-nums}
.arena .pod .rk{font-size:.75rem;color:var(--muted)}
.arena .pod .block{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(2rem,7vw,3.6rem);color:#1b1400}
.arena .p1{order:2}.arena .p1 .block{height:150px;background:linear-gradient(180deg,#ffd970,var(--gold))}
.arena .p2{order:1}.arena .p2 .block{height:110px;background:linear-gradient(180deg,#eef2f5,var(--silver))}
.arena .p3{order:3}.arena .p3 .block{height:84px;background:linear-gradient(180deg,#eaa56a,var(--bronze))}
.arena .p1 .sc{color:var(--gold)}.arena .p2 .sc{color:var(--silver)}.arena .p3 .sc{color:var(--bronze)}
.arena .crown{width:44px;height:30px;color:var(--gold)}
.arena .rest{display:grid;gap:8px;max-width:640px;margin:0 auto;width:100%}
.arena .rrow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:10px 14px;opacity:.15;transition:opacity .35s,transform .35s;transform:translateX(-12px)}
.arena .rrow.on{opacity:1;transform:none}
.arena .rrow .n{font-family:var(--f-mono);color:var(--muted)}
.arena .rrow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arena .rrow .sc{font-family:var(--f-mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.arena .rrow .meter{grid-column:2/4;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.arena .rrow .meter i{display:block;height:100%;background:var(--lime);width:0;transition:width 1s ease}
.arena .hidden-name{filter:blur(8px)}
#sb-count{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(5,8,6,.88);text-align:center}
#sb-count .n{font-family:var(--f-display);font-size:clamp(7rem,32vw,14rem);color:var(--gold);line-height:1}
#sb-count .l{font-family:var(--f-display);font-size:1.6rem}
#sb-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.arena .toast{min-height:1.5em;font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
 #sb-count .n{animation:beat .7s ease}@keyframes beat{from{transform:scale(1.7);opacity:0}to{transform:none;opacity:1}}
 .arena .pod.on.p1 .block{animation:glow 2s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 0 40px rgba(242,193,78,.55)}}
}


.arena .lrow{display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;align-items:center;background:var(--panel);border-radius:14px;padding:12px 14px;border:1.5px solid transparent}
.arena .lrow.me{border-color:var(--lime)}
.arena .lrow.lead{border-color:var(--gold)}
.arena .lrow .lp{font-family:var(--f-display);font-size:1.6rem;color:var(--muted);text-align:center}
.arena .lrow.lead .lp{color:var(--gold)}
.arena .lrow .ln{display:grid;min-width:0}
.arena .lrow .ln b{font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arena .lrow .ln small{color:var(--muted);font-size:.8rem}
.arena .lrow .ls{font-family:var(--f-mono);font-size:1.5rem;font-variant-numeric:tabular-nums}
.arena .lrow .meter{grid-column:2/4;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.arena .lrow .meter i{display:block;height:100%;background:var(--lime);transition:width .8s ease}
.bcount{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(5,8,6,.88);text-align:center;color:#eef2e6}
.bcount .n{font-family:"Lalezar",sans-serif;font-size:clamp(7rem,32vw,14rem);color:#f2c14e;line-height:1}
.bcount .l{font-family:"Lalezar",sans-serif;font-size:1.6rem}
</style>
</head>

let AC=null;
function tone(seq,type="triangle",gap=.09,len=.16,vol=.12){
  if(!SOUND)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*gap;
      o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+len+.02)});}catch(e){}
}

const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=null;
function burst(n=70,x=null,y=null){
  if(reduced)return;
  const cs=getComputedStyle(document.documentElement);
  const cols=["--olive","--tape","--good","--willow","--water"].map(v=>cs.getPropertyValue(v).trim());
  cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  const ox=(x??innerWidth/2)*devicePixelRatio,oy=(y??innerHeight/3)*devicePixelRatio;
  for(let i=0;i<n;i++)parts.push({x:ox,y:oy,vx:(Math.random()-.5)*14*devicePixelRatio,vy:(-Math.random()*12-3)*devicePixelRatio,r:Math.random()*6,s:(5+Math.random()*6)*devicePixelRatio,c:cols[i%cols.length],life:90+Math.random()*40});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35*devicePixelRatio;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=.12;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.beginPath();cx.ellipse(0,0,p.s,p.s/2.4,0,0,Math.PI*2);cx.fill();cx.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),null);
}

   <span class="tape">ملف قضية · YNP-NR · سرّي</span>
   <div class="hero-photo"><img src="media/hero-elk-snow.jpg" alt="ذكور أيائل تقف صفًا على أرض مكسوة بالثلج"><div class="ov"><h1>سر اختلال التوازن البيئي في يلوستون</h1><p>اعثروا على عامل المكافحة المناسب</p></div></div>
   <p class="muted" style="font-size:.85rem">القضية تستخدم أحداثًا وبيانات حقيقية من يلوستون، أما طريقة عرض المرشحين والتصويت فهي محاكاة تعليمية.</p>
   <div class="card q"><label for="team"><b>اسم فريقكم</b></label><input type="text" id="team" placeholder="مثلًا: فريق الصفصاف" value="${esc(S.team)}" maxlength="40" ${S.teamId?"disabled":""}>${S.teamId?`<span class="muted" style="font-size:.85rem">فريقكم مسجّل في ترتيب الفرق.</span>`:`<span class="muted" style="font-size:.85rem">اكتبوا اسم فريقكم ليظهر في ترتيب الفرق.</span>`}</div>
   <ul class="rounds"><li><b>1</b>القصة والمهمة</li><li><b>2</b>دراسة الأيائل</li><li><b>3</b>5 أدلة مخفية في الوادي</li><li><b>4</b>استجواب 6 مرشحين</li><li><b>5</b>القرار والكشف</li></ul>
   <p class="muted">فريق من 3 إلى 5 على جهاز واحد · 100 نقطة · 3 تلميحات من حارس المتنزه · قرابة 30 دقيقة</p>
   <div class="nav"><button class="btn ghost" type="button" data-arena>ترتيب الفرق</button><button class="btn big" data-go="1" id="startBtn" ${S.team?"":"disabled"}>ابدأوا التحقيق</button></div>
   <details class="guide"><summary>دليل الميسّرة</summary>
   <ol><li>قسّمي الحضور فرقًا من 3 إلى 5، وكل فريق يفتح الرابط على جهاز واحد (اعرضي رمز QR للرابط على الشاشة).</li>
   <li>القصة والمهمة: 5 دقائق، قراءة جماعية بصوت مرتفع.</li><li>دراسة الأيائل: 6 دقائق، وتنتهي بأسئلة سريعة.</li>
   <li>مسرح الأدلة: 8 دقائق. لا ضغط قبل اتفاق الفريق.</li><li>الاستجواب: 8 دقائق، وعضو من الفريق يقرأ إفادة كل مرشح بصوته.</li>
   <li>القرار: دقيقتان، ثم يعرض كل فريق جملة الدفاع في دقيقة.</li>
   <li>تضغط الفرق «اكشفوا الحل» معًا، ثم افتحي «ترتيب الفرق» على الشاشة واختاري «حفل التتويج» لكشف المراكز. النتائج تُسجَّل تلقائيًا. الرتب: كبير علماء يلوستون (90+)، خبير نظم بيئية (75+)، حارس ميداني (50+)، محقق متدرب.</li></ol>
   <p class="muted" style="margin-top:6px">زر «لعبة جديدة» في المرحلة الأخيرة يبدأ فريقًا جديدًا على الجهاز نفسه، ونتيجة الفريق السابق تبقى محفوظة في الترتيب.</p></details>
 </section>`,

 /* 1 story */
 ()=>`<section class="scene">
   <span class="tape">المستند 01 · القصة</span><h2>كيف بدأت القضية؟</h2>
   ${vid("story.mp4","story-poster.jpg","شاهدوا القصة أولًا، ثم اقرأوا الملخص تحتها")}
   <div class="chapter"><span class="num">الفصل الأول · بدايات القرن العشرين</span><h3>حرب على المفترسات</h3>
   <ul class="list">
    <li><b>المشكلة كما رآها الناس:</b> المفترسات الكبيرة تهدد الماشية والحيوانات المرغوبة للصيد.</li>
    <li><b>الحل الذي اختاروه:</b> حملات منظمة للقضاء عليها بالتسميم والصيد.</li>
    <li><b>النتيجة:</b> بحلول منتصف القرن، اختفى أحد المفترسات المحلية المهمة تقريبًا من يلوستون.</li>
   </ul>
   <p class="muted" style="font-size:.9rem">أي مفترس هو؟ هذا جزء من التحقيق.</p></div>
   <div class="chapter"><span class="num">الفصل الثاني · الأيائل تتكاثر</span><h3>قطيع بلا من يوقفه</h3>
   <ul class="list">
    <li>مع غياب ذلك المفترس، تراجع أحد أهم أسباب النفوق الطبيعي للأيائل.</li>
    <li>خفضت إدارة المتنزه أعدادها مباشرة لعقود، ثم توقفت في الستينيات.</li>
    <li>ارتفع العدد حتى سُجّل رقم قياسي: <b>19,045 أيلًا</b> في إحصاء يناير 1994.</li>
   </ul></div>
   <div class="chapter"><span class="num">الفصل الثالث · الأيائل والبشر</span><h3>المشكلة تعبر الحدود</h3>
   ${vid("elk-town.mp4","town-4.jpg","أيائل تعبر شارعًا مزدحمًا والناس يتفرجون (مدينة إستس بارك، كولورادو)")}
   <ul class="list">
    <li>أغلب قطيع الشمال يهاجر شتاءً خارج المتنزه، إلى الغابات والأراضي الخاصة.</li>
    <li>هناك ينافس الماشية على المراعي، ويهم عدده الصيادين ومربي الماشية.</li>
    <li>من 1976 إلى 2010 فتحت ولاية مونتانا موسم صيد خارج المتنزه لخفض أعداد الإناث.</li>
   </ul></div>
   <div class="chapter"><span class="num">الفصل الرابع · النبات والأنهار</span><h3>ضفاف بلا ظل</h3>
   ${gal([["valley-river.jpg","وادٍ ونهر في شمال يلوستون"],["willow-river.jpg","صفصاف كثيف على ضفة نهر: هذا ما كان يتراجع"]])}
   <ul class="list">
    <li>الأيائل تأكل براعم الصفصاف والحور قبل أن تكبر.</li>
    <li>بلا شجيرات، تفقد الضفاف تماسكها وظلها، ويفقد النهر موائله.</li>
    <li>القنادس تحتاج الصفصاف، فتراجعت مستعمراتها، وقلّت السدود التي ترفع منسوب الماء.</li>
   </ul></div>
   <div class="note"><b>لكن انتبهوا:</b> الأيائل ليست السبب الوحيد. الطقس والثلوج والجفاف والغذاء والصيد كلها عوامل مؤثرة.</div>
   ${nav("إلى المهمة")}</section>`,

 /* 2 mission */
 ()=>`<section class="scene">
   <span class="tape">المستند 02 · التكليف</span><h2>مهمتكم</h2>
   <div class="card"><p class="lead">أنت الآن ضمن فريق استشاري طُلب منه تحليل مشكلة بيئية في شمال متنزه يلوستون الوطني، أعداد كبيرة من الأيائل أثرت في الغطاء النباتي والمناطق النهرية. أمام فريقكم الآن عدة احتمالات: استعادة مفترس محلي، أو الاعتماد على مفترسات موجودة بالفعل، أو تعزيز الموائل النهرية، أو اختيار تدخل آخر يبدو قادرًا على خفض أعداد الأيائل.</p>
   <p style="margin-top:10px">قد ينجح التدخل في خفض أعداد الأيائل، لكنه يضر بأنواع أخرى. وقد يعيد نباتًا متراجعًا إلى النمو، لكنه لا يعالج سبب تراجعه. وقد يبدو كائن ما مفيدًا لأنه يحسن الأنهار، مع أنه يعتمد أصلًا على وجود النباتات التي تحاولون استعادتها.</p>
   <p style="margin-top:10px"><b>مهمتكم الآن ليست اختيار الكائن الأكثر شراسة أو الأكثر قدرة على قتل الأيائل، بل اختيار التدخل الذي يحقق أفضل توازن بين الهدف، والآلية، والمخاطر، وملاءمة النظام البيئي، وقوة الأدلة.</b></p></div>
   <h3>قواعد التحقيق</h3><p>قبل اعتماد أي مرشح، يجب تقييم:</p>
   <ul class="criteria">${CRITERIA.map(c=>`<li><b>${c[0]}</b>${c[1]}</li>`).join("")}</ul>
   ${nav("إلى دراسة الأيائل")}</section>`,

 /* 3 elk study */
 ()=>{const done=Object.keys(S.tf).length===TF.length&&Object.keys(S.match).length===MATCH.length;return `<section class="scene">
   <span class="tape">المستند 03 · الكائن المستهدف</span><h2>دراسة الأيائل في شمال يلوستون</h2>
   <h3>1. بطاقة التعريف</h3>
   <div class="portrait"><img src="media/elk-bull.jpg" alt="ذكر أيل بقرون كبيرة على سفح جبلي"><div class="tablewrap"><table class="facttable"><tbody>
    <tr><th>الاسم الشائع</th><td>الأيل الأمريكي أو الأيل الأحمر الأمريكي (Elk)</td></tr>
    <tr><th>الاسم العلمي</th><td><i>Cervus canadensis</i></td></tr>
    <tr><th>نوع الكائن</th><td>ثديي عاشب، من فصيلة الأيليات</td></tr>
    <tr><th>الحالة في المنطقة</th><td>نوع محلي أصيل؛ قطيع شمال يلوستون كان موجودًا بأعداد كبيرة</td></tr>
    <tr><th>الحجم</th><td>الذكر قرابة 320 كغ وارتفاعه نحو 1.5 م عند الكتف، والأنثى قرابة 230 كغ، والعجل نحو 14 كغ عند الولادة</td></tr>
    <tr><th>الموطن</th><td>الوديان والمروج والغابات المفتوحة والمناطق القريبة من الأنهار</td></tr>
    <tr><th>الغذاء</th><td>الأعشاب والنباتات العشبية وأوراق الشجيرات والأغصان والبراعم، بحسب الموسم وتوافر الغذاء</td></tr>
    <tr><th>التكاثر</th><td>عجل واحد غالبًا، يولد بين مايو وأواخر يونيو</td></tr>
    <tr><th>السلوك الاجتماعي</th><td>تعيش غالبًا في مجموعات؛ ويتغير حجم المجموعة وتركيبها بحسب الموسم والجنس والظروف البيئية</td></tr>
    <tr><th>وسيلة الدفاع</th><td>اليقظة، والهرب، والتجمع، واستخدام الحجم والقوة والقرون عند الضرورة</td></tr>
   </tbody></table></div></div>
   <h3>2. ما الذي يجعل الأيائل صعبة الإدارة؟</h3>
   ${vid("elk-herd-road.mp4","herd-9.jpg","قطيع أيائل يتنقل بين الشوارع والمروج: الحركة لمسافات طويلة من أهم نقاط قوتها (إستس بارك، كولورادو)")}
   <div class="split">
    <div class="sw plus card"><h4>قوتها</h4><ul class="list">
     <li>تستطيع التحرك لمسافات طويلة، وقد تنتقل موسميًا بين المتنزه والأراضي المحيطة.</li>
     <li>تستفيد من مجموعة متنوعة من النباتات، فلا تعتمد على مصدر غذاء واحد طوال العام.</li>
     <li>تعيش في مجموعات، ما يزيد عدد العيون التي تراقب الخطر.</li>
     <li>تستطيع الإناث البالغة المساهمة في استمرار القطيع عبر التكاثر عندما تكون الظروف مناسبة.</li></ul></div>
    <div class="sw minus card"><h4>نقاط ضعفها</h4><ul class="list">
     <li>تتأثر بعمق الثلوج وشدة الشتاء وتوافر الغذاء.</li>
     <li>العجول أكثر عرضة للافتراس من الأفراد البالغة.</li>
     <li>تحتاج الإناث إلى موارد كافية خلال الحمل والرضاعة، فتؤثر ظروف الغذاء في بقاء الصغار وحالة الأمهات.</li>
     <li>قد يؤدي الضغط المتكرر من المفترسات أو البشر إلى تغيير أماكن الرعي وحركة القطيع، ويختلف مقدار ذلك باختلاف المكان والظروف.</li></ul></div>
   </div>
   <div class="split">
    ${vid("moose-snow.mp4","snow-0.jpg","<span class='tagline'>للمقارنة</span>موظ في ثلج عميق، وهو من فصيلة الأيليات نفسها. الثلج يحدّ من الحركة والغذاء")}
    ${vid("moose-calf.mp4","calf-0.jpg","<span class='tagline'>للمقارنة</span>أنثى موظ مع صغيرها يواجهان حيوانًا يقترب منهما. الصغار هي الحلقة الأضعف")}
   </div>
   <h3>3. كيف تصطاد الأيائل؟ ومن يصطادها؟</h3>
   <p>الأيائل حيوانات عاشبة، لذا فهي لا تصطاد فرائس؛ بل تتجنب المفترسات وتستخدم الحركة الجماعية والهرب. أما المفترسات التي تفترسها فتختلف في طريقة الصيد:</p>
   <div class="grid2">
    <div class="ptype">${ico("g-ambush")}<div><b>تعتمد على الكمائن</b><p>تقترب خفية ثم تنقض على فرد مناسب، ويرتبط اختيار الفريسة بالمكان والغطاء النباتي وعمر الفريسة وحالتها.</p></div></div>
    <div class="ptype">${ico("g-chase")}<div><b>تطارد الفريسة</b><p>تعتمد على التحمل والتنسيق وملاحقة الأفراد الأبطأ أو الأكثر عرضة للانفصال عن المجموعة.</p></div></div>
    <div class="ptype">${ico("g-small")}<div><b>أصغر حجمًا أو انتهازية</b><p>تركز على العجول أو الجيف، ووجودها لا يعني بالضرورة قدرتها على التأثير في نمو القطيع البالغ.</p></div></div>
   </div>
   ${vid("moose-cyclist.mp4","cyc-1.jpg","<span class='tagline'>للمقارنة</span>موظ يندفع نحو درّاج. الأيليات الكبيرة تدافع بحجمها وقوتها (لم يُصب أحد)")}
   <div class="note">ولهذا، فإن <b>عدد عمليات القتل وحده ليس مقياسًا كافيًا</b>. يجب معرفة الفئات العمرية التي تتعرض للافتراس، وعدد الأفراد التي يمكن للمفترس الوصول إليها، ومدى تكرار ذلك، وتأثيره في بقاء القطيع على المدى الطويل.</div>
   <h3>اختبروا معلوماتكم: صح أو خطأ؟ <span class="muted mono">· نقطتان لكل جملة</span></h3>
   <div class="tf">${TF.map((t,i)=>{const a=S.tf[i];const d=a!==undefined;return `<div class="tfrow ${d?(a===t[1]?"right":"wrong"):""}" id="tf${i}"><p>${t[0]}</p><div class="tfbtns">${d?`<b>${t[1]?"صح":"خطأ"}</b>`:`<button data-tf="${i}:1">صح</button><button data-tf="${i}:0">خطأ</button>`}</div>${d?`<p class="why">${t[2]}</p>`:""}</div>`}).join("")}</div>
   <h3>طابقوا كل مشتبه بطريقة صيده <span class="muted mono">· نقطة لكل واحد</span></h3>
   <div class="match">${MATCH.map((m,i)=>{const a=S.match[i];const d=a!==undefined;return `<div class="mrow ${d?(a===m.a?"right":"wrong"):""}" id="mt${i}">${m.img?`<img src="media/${m.img}" alt="">`:ico(m.sym)}<div><b>${m.n}</b><div class="mopts">${PTYPES.map(p=>`<button data-match="${i}:${p[0]}" class="${d?(p[0]===m.a?"right":p[0]===a?"wrong":""):""}" ${d?"disabled":""}>${p[1]}</button>`).join("")}</div></div></div>`}).join("")}</div>
   ${nav("إلى مسرح الأدلة",!done,"أجيبوا عن كل الأسئلة لتكملوا")}</section>`},

 /* 4 evidence */
 ()=>{const f=S.found.filter(Boolean).length,all=S.ev.every(x=>x!==null);return `<section class="scene">
   <span class="tape">المستند 04 · مسرح الأدلة</span><h2>5 أدلة مخفية في الوادي</h2>
   <p>ابحثوا في الرسمة واضغطوا على أي شيء يبدو لكم غريبًا. كل دليل تجدونه يفتح سؤالًا مع صور من الميدان. <span class="muted mono">· 6 نقاط لكل سؤال</span></p>
   <div class="huntbar"><span class="found">${f} / 5</span><button class="lifeline" data-hint="spot" ${S.hints<1||f===5||S.hintSpot!=null&&!S.found[S.hintSpot]?"disabled":""}>تلميح: أين نبحث؟</button></div>
   <div class="hunt" id="hunt">${huntSVG()}</div>
   <p class="toast" id="toast" aria-live="polite"></p>
   ${EVIDENCE.map((e,k)=>S.found[k]?qCard("ev"+k,e,k,S.ev,6):"").join("")}
   ${nav("إلى غرفة الاستجواب",!all,"اعثروا على الأدلة الخمسة وأجيبوا عن أسئلتها")}</section>`},

 /* 6 suspects */
 ()=>{const n=Object.keys(S.v).length;return `<section class="scene">
   <span class="tape">المستند 06 · ملفات المرشحين</span><h2>ستة مرشحين ينتظرون الاستجواب</h2>
   <p>افتحوا ملف كل مرشح، واقرأوه على قواعد التحقيق السبع. ثم صنّفوه: <b>تدخل رئيسي</b>، أو <b>داعم</b>، أو <b>مستبعد</b>. <span class="muted">(4 نقاط لكل تصنيف صحيح، تُكشف في النهاية)</span></p>
   <div class="note" style="font-size:.85rem"><b>ملاحظة زمنية:</b> الأرقام مرتبطة بالفترة التي تتوفر لها تقديرات موثوقة. وإذا لم يتوفر رقم دقيق لعام 1994 فهذا مذكور صراحة.</div>
   <div class="suspects">${SUSPECTS.map(s=>{const v=S.v[s.id];return `<button class="sus" data-sus="${s.id}"><span class="num">${s.L}</span><img class="sphoto" src="media/${s.img[0]}" alt="" loading="lazy"><span class="nm">${s.n}</span><span class="tag">${s.tag}</span><span class="chip ${v?({main:"fit",support:"maybe",out:"out"})[v]:"none"}">${v?VERD[v]:"لم يُستجوب"}</span></button>`}).join("")}</div>
   <p class="muted">استجوبتم ${n} من 6</p>
   ${nav("إلى غرفة القرار",n<SUSPECTS.length,"صنّفوا المرشحين الستة")}</section>`},

 /* 7 decision */
 ()=>`<section class="scene">
   <span class="tape">غرفة القرار</span><h2>أي تدخل ترفعونه لإدارة المتنزه؟</h2>
   <p>تدخل رئيسي واحد فقط. تذكروا: أفضل توازن، لا أقوى مفترس. <span class="muted mono">· 30 نقطة</span></p>
   <div class="pick">${SUSPECTS.map(s=>`<button data-final="${s.id}" aria-pressed="${S.final===s.id}"><img src="media/${s.img[0]}" alt="" loading="lazy">${s.n}</button>`).join("")}</div>
   <div class="card"><h3>جهزوا جملة الدفاع عن قراركم</h3><p class="muted">«اخترنا ___ لأن آليته ___، ويؤثر في ___، ومخاطره ___، ويمكن مراقبته عن طريق ___.»</p></div>
   <div class="nav"><button class="btn ghost" data-go="${S.step-1}">السابق</button><button class="btn big" id="revealBtn" ${S.final?"":"disabled"}>اكشفوا الحل</button></div>
   ${S.final?"":`<p class="muted" style="text-align:left;font-size:.85rem">اختاروا تدخلًا واحدًا</p>`}</section>`,

 /* 9 reveal */
 ()=>{const p=points();const ch=SUSPECTS.find(s=>s.id===S.final);const rank=RANKS.find(r=>p.total>=r[0])[1];const win=S.final==="wolf";return `<section class="scene">

let io=null;
function loadVid(v){
  if(v._loading)return v._loading;
  const url=v.dataset.src;
  v.addEventListener("error",()=>{if(!v.dataset.fb){v.dataset.fb="1";v.src=url;v.play().catch(()=>{})}});
  v.addEventListener("playing",()=>{const b=v.parentElement.querySelector("[data-play]");if(b)b.hidden=true});
  v._loading=fetch(url).then(r=>{if(!r.ok)throw new Error(r.status);return r.blob()})
    .then(b=>{v.src=URL.createObjectURL(new Blob([b],{type:"video/mp4"}))})
    .catch(()=>{v.dataset.fb="1";v.src=url});
  return v._loading;
}
function playVid(v){loadVid(v).then(()=>{v.muted=true;const pr=v.play();if(pr)pr.catch(()=>{const b=v.parentElement.querySelector("[data-play]");if(b)b.hidden=false})})}
function wireVideos(){
  if(io)io.disconnect();
  const vids=[...document.querySelectorAll("video[data-src]")];
  vids.forEach(v=>v.addEventListener("play",()=>{if(!v.src)playVid(v)}));
  if(reduced||!("IntersectionObserver" in window))return;
  io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting)playVid(v);else if(v.src)v.pause()}),{threshold:.5});
  vids.forEach(v=>io.observe(v));
}

const CFG=window.YS_CONFIG||{};

async function rpc(fn,body){
  const r=await fetch(CFG.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:Object.assign({apikey:CFG.key,"Content-Type":"application/json"},/^eyJ/.test(CFG.key)?{Authorization:"Bearer "+CFG.key}:{}),body:JSON.stringify(body||{})});
  if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,200));
  const t=await r.text();return t?JSON.parse(t):null;
}
function teamPayload(){const p=points();const fin=S.maxStep>=REVEAL;return {p_id:S.teamId,p_secret:S.teamSecret,p_score:fin?p.total:p.live,p_step:S.maxStep,p_finished:fin,p_choice:fin?(S.final||null):null}}
let syncTimer=null,syncing=false,syncAgain=false;
async function registerTeam(){
  if(!ONLINE||S.teamId||!S.team)return;
  try{const r=await rpc("register_team",{p_name:S.team});const row=Array.isArray(r)?r[0]:r;S.teamId=row.id;S.teamSecret=row.secret;save()}
  catch(e){console.warn("register failed",e)}
}
async function syncNow(){
  if(!ONLINE)return;
  if(!S.teamId){await registerTeam();if(!S.teamId)return}
  if(syncing){syncAgain=true;return}
  syncing=true;
  try{await rpc("update_team",teamPayload())}catch(e){console.warn("sync failed",e)}
  syncing=false;if(syncAgain){syncAgain=false;syncNow()}
}
function queueSync(){if(!ONLINE||!S.team)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,700)}

  $("#bShowNote").textContent=n?(waiting>0?`${n} فرق أنهت القضية · ${waiting} ما زالت تلعب`:`${n} فرق أنهت القضية`):"لم تُنهِ أي فرقة القضية بعد";
  const shown=i=>i>=n-bRevealed,cls=["p1","p2","p3"];
  $("#bPodium").innerHTML=n?r.slice(0,3).map((t,i)=>{const on=shown(i);return `<div class="pod ${cls[i]} ${on?"on":""}">${i===0?`<svg class="crown" aria-hidden="true"><use href="#crown"/></svg>`:""}<span class="nm ${on?"":"hidden-name"}">${on?esc(t.name):"؟؟؟"}</span><span class="sc" data-score="${t.score}">${on?t.score:"–"}</span><span class="rk">${on?rankOf(t.score):"&nbsp;"}</span><div class="block">${t.pos}</div></div>`}).join(""):"";
  $("#bRest").innerHTML=r.slice(3).map((t,k)=>{const on=shown(k+3);return `<div class="rrow ${on?"on":""}"><span class="n">${t.pos}</span><span class="nm ${on?"":"hidden-name"}">${on?esc(t.name):"؟؟؟؟؟"}</span><span class="sc">${on?t.score:"–"}</span><span class="meter"><i style="width:${on?t.score:0}%"></i></span></div>`}).join("");
  $("#bReveal").hidden=bRevealed>0&&bRevealed<n;$("#bNext").hidden=!(bRevealed>0&&bRevealed<n);
  $("#bReveal").textContent=bRevealed>=n&&n?"أعد الكشف":"ابدأ الكشف";$("#bReveal").disabled=!n;$("#bAll").disabled=!n||bRevealed>=n;
}
function bCountUp(el){const tgt=+el.dataset.score;if(reduced||!tgt){el.textContent=tgt;return}const st=performance.now();(function f(t){const v=Math.round(tgt*Math.min(1,(t-st)/900));el.textContent=v;if(v<tgt)requestAnimationFrame(f)})(st)}
function bNext(){
  const n=showRows().length;if(bRevealed>=n)return;
  const step=()=>{bRevealed++;renderShow();const idx=n-bRevealed;const el=idx<3?document.querySelectorAll("#bPodium .pod .sc")[idx]:null;if(el)bCountUp(el);
    if(bRevealed===n){tone([523,659,784,1046,784,1046,1318],"triangle",.13,.3,.16);burst(180);setTimeout(()=>burst(110,innerWidth*.2,innerHeight*.35),380);setTimeout(()=>burst(110,innerWidth*.8,innerHeight*.35),700)}
    else if(idx<3){sfx.good();const p=document.querySelectorAll("#bPodium .pod")[idx];if(p){const rc=p.getBoundingClientRect();burst(40,rc.left+rc.width/2,rc.top)}}else sfx.tick()};
  if(bRevealed===n-1&&n>1){const ov=$("#bCount"),nEl=$("#bCountN");ov.hidden=false;let c=3;nEl.textContent=c;const drum=()=>tone([110,110,110,110,110,110],"square",.06,.05,.05);drum();
    const iv=setInterval(()=>{c--;if(c>0){nEl.textContent=c;drum()}else{clearInterval(iv);ov.hidden=true;step()}},850)}else step();
}
function showArena(){$("#app").hidden=true;$(".top").hidden=true;$("#arena").hidden=false;window.scrollTo(0,0);bRevealed=0;loadBoard();clearInterval(bTimer);bTimer=setInterval(loadBoard,5000)}
function hideArena(){clearInterval(bTimer);$("#arena").hidden=true;$("#app").hidden=false;$(".top").hidden=false;window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const m=e.target.closest("[data-bmode]");if(m){bMode=m.dataset.bmode;bRevealed=0;renderBoard();return}
  if(e.target.closest("#bReveal")){if(bRevealed>=showRows().length)bRevealed=0;renderShow();bNext();return}
  if(e.target.closest("#bNext")){bNext();return}
  if(e.target.closest("#bAll")){const n=showRows().length;if(bRevealed<n-1){bRevealed=n-1;renderShow()}bNext();return}
  if(e.target.closest("#bFs")){try{const el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else{const p=el.requestFullscreen&&el.requestFullscreen();if(p)p.catch(()=>{})}}catch(_){}return}
});
document.addEventListener("change",e=>{if(e.target.id==="bRange"){bRange=e.target.value;bRevealed=0;loadBoard()}});
document.addEventListener("keydown",e=>{if($("#arena").hidden||bMode!=="show")return;if((e.key===" "||e.key==="ArrowLeft")&&e.target===document.body){e.preventDefault();bNext()}});

render();
if(S.teamId)queueSync();
if(location.hash==="#board")showArena();
</script>
